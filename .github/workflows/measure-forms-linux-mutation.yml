# One-off measurement for #487: the `Forms` mutation population on Linux, with the
# invocation the #98 closing record names. It runs only on pushes to its own branch,
# which is never merged.

name: Measure Forms mutation on Linux

on:
  push:
    branches:
      - 487-forms-linux-mutation

permissions:
  contents: read

jobs:
  mutate-forms:
    name: Forms mutation (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          coverage: pcov

      # PCOV overrides zend_execute_ex, so a tracing JIT warns in every php child,
      # including the ones a compile-cleanly test spawns. Turn it off for all of them.
      - name: Disable the JIT for every php process
        run: |
          php --ini
          for f in $(php -r 'echo implode(" ", array_filter(array_merge([php_ini_loaded_file()], explode(",", (string) php_ini_scanned_files())), "strlen"));'); do
            f=$(echo "$f" | tr -d "[:space:]")
            if grep -q "opcache.jit" "$f"; then echo "rewriting $f"; sudo sed -i -E "s/^(opcache.jit *= *).*/\1off/" "$f"; grep -n "opcache.jit" "$f"; fi
          done
          test "$(php -r 'echo ini_get("opcache.jit");' 2>/dev/null)" = off

      - name: Record the platform and tool revisions
        run: |
          set -x
          uname -a
          cat /etc/os-release
          git rev-parse HEAD
          git rev-parse origin/main
          git diff --name-only origin/main...HEAD
          php -v
          php --ri pcov
          composer show pestphp/pest-plugin-mutate
          composer show pestphp/pest
          cat patches.lock.json

      - name: Run the Forms mutation population
        run: |
          mapfile -t tests < <(grep -rlF 'WordPressImport\Forms' tests/Unit tests/Integration | sort)
          echo "test files: ${#tests[@]}"
          php -d opcache.enable_cli=0 -d opcache.jit=off -d memory_limit=2G vendor/bin/pest "${tests[@]}" \
            --mutate --path=src/Services/WordPressImport/Forms --covered-only --everything --no-cache \
            > mutate.log 2>&1 || true
          tail -60 mutate.log

      - name: Check the run
        run: php .claude/skills/pest-testing/scripts/check-mutation-run.php mutate.log --min=100

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: forms-mutation-linux
          path: mutate.log
