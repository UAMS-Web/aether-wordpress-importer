name: CI

# THE SHARED CHAIN (#415). The `checks` job calls the reusable workflow in
# UAMS-Web/uams-ci-workflows, whose source is `.claude/skills/code-quality/templates/ci-reusable.yml`
# in UAMS-Web/uams-claude-skills. It runs Composer validate, synced files, no-emoji, aggregate-needs,
# Pint, Rector, PHPStan, mutate-ignore, mutate and Pest, and ends in a `Chain result` job that fails
# unless each of them succeeded. Its checks report as `checks / <job name> (<operating system>)`.
#
# - `uses:` names a release tag, never a branch, so a change to the chain reaches this repository
#   only when the tag here moves. Dependabot does not move it.
# - The called jobs check out this repository and run what it carries:
#   `.github/actions/setup/action.yml`, the synced `.claude/skills/` scripts, the Composer scripts
#   `test:pint`, `test:refactor`, `stan` and `test`, and `tests/skip-baseline.json`.
#   `test:pint` runs `scripts/run-pint.mjs`, so the chain's Pint job lints the dot-directories a
#   bare `pint --test` skips, as this workflow's own job did.
# - `with:` keeps the Windows leg (#186). The chain runs `pest` and `mutate-ignore` on Linux,
#   Windows and macOS by default, and `composer-validate`, `pint`, `rector` and `phpstan` on Linux
#   alone; `all-platform-jobs` puts those four back on Windows, which also adds a macOS leg.
#   The chain has no Linux-and-Windows setting.
# - Mutation testing is on (#519). The chain's `mutate` job runs on `ubuntu-latest` alone, mutates
#   only the PHP files under `src` a pull request or a push changes, under a 45-minute limit, and
#   mutates everything `composer mutate` covers on the weekly schedule and on a manual run, under the
#   chain's `mutate-full-timeout-minutes` default (180). It fails on any survivor. `mutate-ignore`
#   runs only while `mutate` is on.
#
# PLAIN JOBS. `mutate-ignore-breadth`, `spell`, `node-test` and `python-test` stay here as jobs of
# their own, each a matrix over `ubuntu-latest` and `windows-latest`.
#
# REQUIRED CHECKS (#163). A ruleset for this repository requires three contexts
# on `main`: `CI`, `Attribution footer` and `Closing keywords`, the same three the
# Statamic add-ons and `uamswp-migration-api` require. `CI` is the last job in
# this file; it `needs:` the call and every plain job, runs `if: always()`, and fails unless
# every needed job reports `success` (a `skipped` or `cancelled` job fails it).
# The ruleset therefore never lists a job by name: the chain can gain or lose a job, and a plain
# job is required once it is added to the `needs:` list of `CI`. Add it there in the same change;
# `scripts/ci-local.test.mjs` fails otherwise. Do not rename `CI` or `checks`. The other two
# required contexts are the jobs of `check-attribution-footer.yml` and
# `check-closing-keyword-across-lines.yml`. Job names must stay unique across every workflow in
# this repository.
#
# RUN_REMOTE_CI: off switch, mirroring uams-statamic (UAMS-Web/uams-statamic-archive#980).
# Every job but `CI` is gated on `if: vars.RUN_REMOTE_CI != 'false'`. Set an
# Actions variable `RUN_REMOTE_CI` to `false` and they report `skipped` without
# being dispatched to a runner, so `CI` fails and no pull request can merge until
# it is unset. Unset (or any other value) runs CI as normal, which is the default.
#
#   - The switch began as a budget kill-switch for private repositories, whose
#     Actions minutes bill to one organization pool. This repository is public,
#     so its runs do not, and the organization variable (scoped to private
#     repositories) does not reach it: `actions/organization-variables` returned
#     `total_count` 0 here on 2026-10-27. Only a REPOSITORY variable turns it off.
#   - A job skipped by its `if:` reports success to a required check, which is
#     why the ruleset requires `CI` and never a gated job.
#
# PARITY: `local-ci.json`, the shared local CI runner's job list (wordpress-importer-archive#1319),
# reproduces the plain jobs below and the chain's `pint`, `phpstan`, `rector`, `pest` and
# `validate` for local runs. The plain jobs' `run` steps are flagged `# PARITY:`; the chain's jobs
# run the Composer scripts, and `scripts/ci-local.test.mjs` checks that each local command is the
# script it mirrors. A pre-commit hook (`.githooks/pre-commit`, auto-wired by composer) blocks a
# commit that stages only one of `ci.yml` and `local-ci.json`; bypass with `--no-verify`. See
# `.claude/skills/local-ci/SKILL.md`.

on:
  pull_request:
  push:
    branches: [main]
  # Lets the workflow be run on demand against a branch. A manual run mutates everything.
  workflow_dispatch:
  # The weekly full mutation pass (#519), which catches decay no pull request touches: a dependency
  # or tooling change. A schedule runs on the default branch, and GitHub disables it after 60 days
  # without repository activity.
  schedule:
    - cron: '17 7 * * 1'

# A new push to a pull request cancels that pull request's stale run. Every other run (a push to
# the default branch, a manual run) gets a group of its own, keyed on the commit, so a later push
# never cancels it: GitHub keeps one running and one pending run per group and cancels the pending
# one when another is queued, whatever `cancel-in-progress` says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Bash on both operating systems. The `run` steps are bash, and a Windows runner's
# default shell is PowerShell, which reads `$GITHUB_OUTPUT` and `set -o pipefail` as
# something else entirely.
defaults:
  run:
    shell: bash

jobs:
  # The shared chain. Keep the reference a release tag.
  checks:
    if: vars.RUN_REMOTE_CI != 'false'
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.10.1
    with:
      all-platform-jobs: 'composer-validate pint rector phpstan'
      mutate: true

  mutate-ignore-breadth:
    name: Mutation annotation breadth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # PARITY: mirrored by the mutate-ignore-breadth job in local-ci.json.
      - name: Measure mutation annotation breadth
        run: php .claude/skills/pest-testing/scripts/check-mutate-ignore-breadth.php

  changed-tests:
    name: Changed tests against base (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: vars.RUN_REMOTE_CI != 'false'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: ./.github/actions/setup

      # Feature tests require the host app and are excluded from this standalone report.
      # Test failures against base are reported, not rejected. An unavailable comparison fails.
      # PARITY: mirrored by the `changed-tests` job in local-ci.json.
      - name: Report changed tests against base
        run: node .claude/skills/pest-testing/scripts/changed-tests-against-base.mjs --tests tests/Unit --tests tests/Integration

  spell:
    name: Spell check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: vars.RUN_REMOTE_CI != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install the spell-check toolchain
        run: npm ci

      # Checks the prose corpus only -- `.claude/`, `docs/` and the README --
      # which is what wordpress-importer-archive#922 decided. The PHP tree is excluded deliberately: it
      # contributes 1,237 further unknown words, almost all WordPress field
      # names from one mapping file, and none of them are prose defects.
      #
      # `--dot` is load-bearing. Without it the glob skips dot-directories, so
      # `.claude/` is never read and the job reports a clean pass over nothing.
      # PARITY: mirrored by the `spell` job in local-ci.json (scripts/run-spell.mjs).
      - name: Run cspell
        # --no-must-find-files is kept so one non-matching glob does not fail the run, but it
        # also suppresses the only signal separating "read the corpus and found nothing" from
        # "read nothing at all" — measured on cspell 10.0.1, a zero-file run exits 0 with the
        # flag and 1 without it. The floor is restored here instead. Mirrors the
        # spellFloorRefusal() check in scripts/run-spell.mjs.
        run: |
          set -o pipefail
          out=$(npx cspell --no-progress --no-must-find-files --dot ".claude/**/*.md" "docs/**/*.md" "README.md" "AGENTS.md" "CLAUDE.md" "tests/CLAUDE.md" ".github/**/*.md" 2>&1) || rc=$?
          printf '%s\n' "$out"
          if [ -n "${rc:-}" ]; then exit "$rc"; fi
          files=$(printf '%s' "$out" | sed -n 's/.*Files checked: \([0-9][0-9]*\).*/\1/p' | tail -1)
          if [ -z "$files" ]; then
            echo 'cspell printed no "Files checked" summary — output shape changed, so a pass cannot be trusted' >&2
            exit 1
          fi
          if [ "$files" -eq 0 ]; then
            echo 'cspell checked 0 files — the corpus globs matched nothing, so a pass means nothing' >&2
            exit 1
          fi

  node-test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: vars.RUN_REMOTE_CI != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Deliberately no `npm ci` and no `cache: npm`. Every import across the seven
      # test files is a `node:` builtin -- node:assert/strict, node:child_process,
      # node:fs, node:os, node:path, node:test, node:url -- with no bare package
      # name among them, so this job needs Node and nothing else. That also keeps it
      # runnable in a tree with no `node_modules`, which wordpress-importer-archive#950 records as the state
      # every tree is currently in.
      #
      # The glob is quoted so Node expands it rather than the shell: `node --test`
      # accepts a pattern directly since v22, and an unquoted glob would resolve
      # differently between the runner's shell and a Windows spawn. A bare directory
      # argument does NOT work -- `node --test scripts/` fails with "Cannot find
      # module .../scripts", measured on v22.22.3.
      # PARITY: mirrored by the `node-test` job in local-ci.json.
      - name: Run the script tests
        run: node --test "scripts/*.test.mjs"

  python-test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: vars.RUN_REMOTE_CI != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Runs every *.test.py file (wordpress-importer-archive#1155). A `*.test.py` name is not an importable
      # module, so `unittest` discovery never reaches one, and one of the files is
      # under .claude/skills/ rather than scripts/. The Node driver finds both and
      # runs each with the runner image's python3; it fails rather than skips when
      # there is no Python 3 or nothing to run. No `npm ci`: it imports only
      # `node:` builtins and scripts/spawn-helpers.mjs.
      # PARITY: mirrored by the `python-test` job in local-ci.json.
      - name: Run the Python tests
        run: node scripts/python-tests.mjs

  # The one check the ruleset requires from this workflow (#163). Keep `needs:`
  # naming the call and every plain job. Not gated on RUN_REMOTE_CI: it must run,
  # and fail, when the switch skips the others.
  ci:
    name: CI
    needs:
      - checks
      - mutate-ignore-breadth
      - changed-tests
      - spell
      - node-test
      - python-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
